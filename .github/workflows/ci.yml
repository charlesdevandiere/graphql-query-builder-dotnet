name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.x'

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: dotnet tool restore
        run: dotnet tool restore

      - name: dotnet test
        run: dotnet test -c Release --logger xunit -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura

      - name: Generate coverage report
        run: dotnet tool run reportgenerator -reports:**/coverage.cobertura.xml -targetdir:tests/coverage -reportTypes:Cobertura

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: tests/coverage/

      - name: dotnet pack
        run: dotnet pack ./src/GraphQL.Query.Builder/GraphQL.Query.Builder.csproj -c Release -o out -p:Version=${{ steps.gitversion.outputs.semVer }} --include-symbols

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: out
          path: out/

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    environment: release

    steps:
      - uses: actions/checkout@v6

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: out
          path: out/

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.semVer }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, updating its assets."
            gh release upload "$VERSION" out/*.nupkg --clobber
          else
            gh release create "$VERSION" out/*.nupkg \
              --target "${{ github.sha }}" \
              --title "$VERSION" \
              --generate-notes
          fi